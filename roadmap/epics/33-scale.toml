[[epic]]
id = "E34"
title = "Fleet Orchestration"
theme = "scale"
goal = "Run Val across 10-50 repos within budgets, with fair scheduling and sane PR volume."
milestone = "M6"
lang = ["rust"]

[[issue]]
id = "E34-01"
title = "Fleet manifest loader and repo registry"
deps = ["E02-03"]
summary = "Load, validate, and query the manifest; resolve owners and tiers."
acceptance = ["Manifest errors point to lines", "Owners validated against org", "Registry queryable via CLI"]

[[issue]]
id = "E34-02"
title = "Campaign model"
deps = ["E34-01", "E20-03"]
summary = "A campaign has a goal (e.g. raise branch coverage of tier-1 repos), scope, budgets, and stop conditions."
acceptance = ["Campaign state persisted", "Stop conditions tested", "Progress report"]

[[issue]]
id = "E34-03"
title = "Work queue and scheduler"
deps = ["E34-02", "E06-04"]
summary = "Prioritize gaps by risk and ROI with concurrency limits, fairness, and per-repo cooldowns."
