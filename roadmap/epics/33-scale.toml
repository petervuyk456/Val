deps = ["E34-03", "E21-04"]
summary = "Query current campaigns, per-repo stage, and outcomes for dashboards."
acceptance = ["Schema versioned", "Pagination", "Auth documented"]

[[issue]]
id = "E34-06"
title = "Adoption-stage tracking and promotion workflow"
deps = ["E34-01", "E14-06"]
summary = "Track each repo's stage (S0-S6), entry and exit checks, and approvals."
acceptance = ["Promotion requires recorded approver", "Stage regressions auditable", "Matches the rollout playbook"]

[[issue]]
id = "E34-07"
title = "PR volume and noise management"
size = "S"
deps = ["E34-03"]
summary = "Caps per repo/team, batching, quiet hours, and digest summaries."
acceptance = ["Caps configurable", "Digest mode", "Owners can snooze"]

[[issue]]
id = "E34-08"
title = "Stale Val PR management"
deps = ["E18-03"]
summary = "Rebase, supersede, or close abandoned Val PRs."
acceptance = ["Never closes human-modified PRs", "Superseding links old and new", "Dry-run"]

