acceptance = ["Human approval before deletion", "Evidence per proposal", "Never touches quarantined tests silently"]

[[issue]]
id = "E35-05"
title = "Suite health score"
deps = ["E21-04"]
summary = "Per-repo score from speed, flake rate, mutation, coverage, and layer balance."
acceptance = ["Definition documented", "Trend and drill-down", "Used in campaign prioritization"]

[[issue]]
id = "E35-06"
title = "Intentional-change test maintenance"
deps = ["E35-02"]
summary = "When source changes intentionally, update affected tests and show why."
acceptance = ["Never loosens assertions silently", "Human review required", "Diff-explained"]

