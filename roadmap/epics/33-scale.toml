# ===========================================================================
[[epic]]
id = "E33"
title = "Cross-Repo Intelligence"
theme = "scale"
goal = "Reason across repos: shared libraries, their consumers, and the contracts between them."
milestone = "M6"
lang = ["rust", "python", "typescript"]

[[issue]]
id = "E33-01"
title = "Multi-repo workspace model"
deps = ["E01-01"]
summary = "A Workspace of N repos with read-only vs write targets, cross-repo path references, and per-repo credentials."
acceptance = ["Single-repo is a degenerate case", "Write targets explicit in every action", "Serializable and resumable"]

[[issue]]
id = "E33-02"
title = "Cross-repo package dependency graph"
deps = ["E33-01", "E03-10"]
summary = "Map internal npm/Poetry packages (registry, git, path refs) to producers and consumers across repos."
acceptance = ["Private registry names resolved", "Version constraints captured", "Graph exportable and visualized"]

[[issue]]
id = "E33-03"
title = "Blast-radius scoring"
deps = ["E33-02", "E06-01"]
summary = "Rank shared code by dependents, usage depth, and criticality and feed it into gap scoring."
acceptance = ["Score explainable", "Cycles handled", "Sensitivity analyzed"]

[[issue]]
id = "E33-04"
title = "Downstream impact testing"
deps = ["E33-02", "E04-03"]
summary = "On a library change, build the consumer matrix and run consumer suites against the candidate version before release."
acceptance = ["Runs in CI on library PRs", "Consumer failures attributed to the change", "Cost bounded by affected-consumer selection"]

[[issue]]
id = "E33-05"
title = "Consumer-driven contract extraction"
deps = ["E33-02", "E26-06"]
summary = "Infer how consumers use library APIs from call sites and generate contract tests in the library."
acceptance = ["Unused API surface reported", "Contracts reviewed before merge", "Stable under refactors"]

[[issue]]
id = "E33-06"
title = "ADR: shared test-utilities library"
type = "adr"
size = "S"
deps = ["E33-02"]
summary = "Scope, packaging, versioning, and governance of a Val-maintained library of fixtures, factories, fake AWS helpers, markers, and assertion helpers."
acceptance = ["Decision recorded", "Breaking-change policy", "Ownership assigned"]

[[issue]]
id = "E33-07"
title = "Shared test-utils: Python package"
deps = ["E33-06"]
lang = ["python"]
summary = "Publish the Python utilities with docs and tests that meet Val's own bar."
acceptance = ["Mutation score threshold met", "Published to the private index", "Adoption guide"]

[[issue]]
id = "E33-08"
title = "Shared test-utils: TypeScript package"
deps = ["E33-06"]
lang = ["typescript"]
summary = "Publish the TS utilities with docs and tests that meet Val's own bar."
acceptance = ["Mutation score threshold met", "Published to the private registry", "Adoption guide"]

[[issue]]
id = "E33-09"
title = "Cross-repo agent context"
deps = ["E33-02", "E09-10"]
summary = "Load relevant slices of other repos into role context with access control and provenance."
acceptance = ["Access respects repo classification", "Slices cited", "Size-bounded"]

[[issue]]
id = "E33-10"
title = "Coordinated multi-repo PR sets"
deps = ["E18-03", "E33-04"]
summary = "Linked PRs across repos with ordering, status roll-up, and rollback guidance."
acceptance = ["Merge order enforced", "Partial merge detected", "Single status view"]

