[[epic]]
id = "E35"
title = "Test Lifecycle & Maintenance"
theme = "scale"
goal = "Keep suites healthy after they are written: flake, staleness, speed, and PR-time coverage."
milestone = "M7"
lang = ["rust", "python", "typescript"]

[[issue]]
id = "E35-01"
title = "Flaky-test detection and quarantine"
deps = ["E18-05"]
summary = "Detect flakes from CI history and quarantine with an owner and an expiry."
acceptance = ["Quarantine never silent", "Expiry enforced", "Flake rate trended"]

[[issue]]
id = "E35-02"
title = "PR-time test agent"
deps = ["E12-02", "E18-03"]
summary = "On human PRs, propose or complete tests for changed code, diff-scoped."
