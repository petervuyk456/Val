# Layer packs are independently adoptable after M4. Within each pack the order is:
# charter -> gate (deterministic) -> generator -> pilot. Gates arrive first so
# even human-written tests in that layer can be verified.

# ===========================================================================
[[epic]]
id = "E25"
title = "Layer: Smoke & Health"
theme = "layers"
goal = "Fast, universal 'is it alive' checks run on every push and after every deploy."
milestone = "L"
lang = ["python", "typescript"]

[[issue]]
id = "E25-01"
title = "Smoke contract and charter"
type = "adr"
size = "S"
deps = ["E07-13"]
summary = "Define smoke: under 60s, declared dependencies only, marker/project conventions, and what must never be in smoke."
acceptance = ["Time budget enforceable by gate", "Per-language marker conventions", "Examples for service, library, and CLI repos"]

[[issue]]
id = "E25-02"
title = "Python smoke generator"
deps = ["E25-01", "E12-01"]
summary = "Entrypoint boot, env hydration, config validation, and AWS client construction without calls; marker `smoke`."
acceptance = ["No network", "Fails when entrypoints are missing", "Passes anti-pattern lint"]

[[issue]]
id = "E25-03"
title = "TypeScript smoke generator"
deps = ["E25-01", "E12-01"]
summary = "Typecheck/build, module import, and health-endpoint boot in a vitest `smoke` project."
acceptance = ["Works in pnpm workspaces per package", "No network", "Fails on circular import crashes"]

[[issue]]
id = "E25-04"
title = "Smoke gate and required-check wiring"
size = "S"
deps = ["E25-01", "E19-03"]
summary = "Enforce the time budget and make smoke a required check via generated workflow."
acceptance = ["Budget breach fails", "Workflow synthesized by `val ci init`", "Post-deploy reuse documented"]

