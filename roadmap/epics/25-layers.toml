[[epic]]
id = "E26"
title = "Layer: Integration & Contract"
theme = "layers"
goal = "Integration tests against real, ephemeral dependencies - not mock-everything structures - plus contract tests at boundaries."
milestone = "L"
lang = ["python", "typescript", "aws"]

[[issue]]
id = "E26-01"
title = "Service dependency declaration"
size = "S"
deps = ["E02-01", "E04-03"]
summary = "Repos declare dependencies (postgres, redis, localstack services, kafka) in val.toml; Val provisions them."
acceptance = ["Schema documented", "Auto-detected suggestions in `val init`", "Versions pinned"]

[[issue]]
id = "E26-02"
title = "Ephemeral service provisioning in sandbox and CI"
deps = ["E26-01"]
summary = "Testcontainers or GHA service containers with health checks, parallel-safe isolation (unique schemas/prefixes), and teardown."
acceptance = ["Works on laptop and GHA", "Leak detection for containers and ports", "Startup time budgeted"]

[[issue]]
id = "E26-03"
title = "LocalStack patterns for S3, DynamoDB, SQS, Lambda"
deps = ["E26-02"]
summary = "Fixtures, fidelity notes, and a policy for when real ephemeral AWS resources are warranted."
acceptance = ["Fixtures per service in both languages", "Known-gap list", "Cost guard for real-AWS escape hatch"]

[[issue]]
id = "E26-04"
title = "Relational DB testing"
deps = ["E26-02"]
summary = "Migrations from scratch, transactional isolation, and factory-based data for Postgres/MySQL."
acceptance = ["Migration up/down tested", "Parallel tests isolated", "No shared mutable state"]

[[issue]]
id = "E26-05"
title = "Third-party HTTP: record/replay and provider verification"
deps = ["E26-02"]
summary = "VCR.py/msw/nock fixtures with staleness checks; live calls forbidden in tests; scheduled provider-verification job."
acceptance = ["Stale cassette detection", "Live-call attempt fails the test", "Secrets scrubbed from cassettes"]

[[issue]]
id = "E26-06"
title = "ADR: contract-testing approach"
type = "adr"
size = "S"
deps = ["E26-01"]
summary = "Choose Pact with a broker versus schema/OpenAPI-based contracts for the estate; consider consumer-driven contracts for shared libraries."
acceptance = ["Decision recorded", "Pilot on one boundary", "Operational cost estimated"]

[[issue]]
id = "E26-07"
title = "Queue and stream test harness"
deps = ["E26-02"]
summary = "SQS/Redis/Kafka harness for publish-consume tests with deterministic draining."
acceptance = ["No sleeps for sync", "Consumer lag handled", "Cleanup guaranteed"]

[[issue]]
id = "E26-08"
title = "Integration gate: real dependencies only"
deps = ["E07-03", "E26-02"]
summary = "Reject integration tests that mock the dependency under test; verify the container was actually exercised."
acceptance = ["Traffic observed at the dependency", "Red-team cases rejected", "Layer marker enforced"]

